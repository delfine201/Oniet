<!DOCTYPE html>
<html class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> PAGINA PRINCIPAL </title>
<!-- IONICONS -->
<script type="module"
src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js">
</script>
<script nomodule
src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js">
</script>

<link rel="stylesheet" href="CSS/index.css">

</head>

<body>
  <header class="bartop">
    <p id="mode"></p>
    <button class="theme" id="theme">
      <ion-icon id="itheme" name="moon"></ion-icon>
    </button>
  </header>

  <h2> Hola <span id="nombretxt"></span> 🌟</h2>

  <main class="info">
    <article class="person">
        <h3 class="title">Usuario</h3>
        <p class="date"> Dni: <span id="dnitxt"></span></p>
        <p class="date"> Edad: <span id="edadtxt"></span></p>
        <p class="date" style="grid-column:1;"> Altura: <span id="alturatxt"></span></p>
        <p class="date"> Peso: <span id="pesotxt"></span></p>
        <!--<p class="date"> Alergias: [alergias]</p>
        <p class="date"> Enfermedades: [enfermedades]</p>-->
    </article>
    
    <article class="datess">
        <h2 class="title">Signos Vitales</h2>
        <p class="date"> Pulso Cardiaco: <span id="pctxt"></span>bpm</p>
        <p class="date"> Oxigeno en Sangre: <span id="otxt"></span>%</p>
        <p class="date"> Presion Arterial: <span id="ptxt"></span>mmHg</p>
    </article>
  </main>

  <main class="absolutes">
    <div class="zone">

      <!-- BOTÓN CENTRAL -->

      <div class="navigation">
        <ion-icon id="menu" name="menu"></ion-icon>
      </div>

      <!-- ARRIBA -->

      <a href="index.html" class="item" style="--i: 0;">

        <ion-icon name="home"></ion-icon>

      </a>

      <!-- DERECHA -->

      <div class="item" style="--i: 1;">

        <ion-icon name="settings"></ion-icon>

      </div>

      <!-- ABAJO -->

      <div class="item" style="--i: 2;">

        <ion-icon name="person"></ion-icon>

      </div>

      <!-- IZQUIERDA -->

      <a href="#" id="ble" class="item" style="--i: 3;">

        <ion-icon name="bluetooth"></ion-icon>

      </a>

      <a href="qr.html" class="item" style="--i: 4;">

        <ion-icon style="position: absolute; scale: 1.3; z-index: 10;" name="scan"></ion-icon>
        <ion-icon style="scale: .7; z-index: 5;"name="qr-code"></ion-icon>

      </a>

      <div class="item" style="--i: 5;" >
          
        <ion-icon name="folder"></ion-icon>

      </div>

    </div>
  </main>

<script type="module" src="JS/index.js"></script>

</body>

</html>
