<!DOCTYPE html>
<html class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> PAGINA PRINCIPAL </title>
<!-- IONICONS -->
<script type="module"
src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js">
</script>
<script nomodule
src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js">
</script>

<link rel="stylesheet" href="style.css">

</head>

<body>
  <div class="bartop">
    <p id="mode"></p>
    <button class="theme" id="theme">
      <ion-icon id="itheme" name="moon"></ion-icon>
    </button>
  </div>

  <h2> Hola [Nombre] 🌟</h2>

  <main class="info">
    <aside class="person">
        <h3 class="title">Usuario</h3> <br>
        <p> Dni: [dni]</p>
        <p> Edad: [edad]<p>
        <p> Peso: [peso]</p> <br>
        <p> Altura: [altura]</p>
        <p> Alergias: [alergias]</p>
        <p> Enfermedades: [enfermedades]</p>
    </aside>
  </main>

  <div class="zone">

    <!-- BOTÓN CENTRAL -->

    <div class="navigation">
      <ion-icon id="menu" name="menu"></ion-icon>
    </div>

    <!-- ARRIBA -->

    <div class="item" style="--i: 0;">

      <ion-icon name="home"></ion-icon>

    </div>

    <!-- DERECHA -->

    <div class="item" style="--i: 1;">

      <ion-icon name="settings"></ion-icon>

    </div>

    <!-- ABAJO -->

    <div class="item" style="--i: 2;">

      <ion-icon name="person"></ion-icon>

    </div>

    <!-- IZQUIERDA -->

    <div class="item" style="--i: 3;">

      <ion-icon name="bluetooth"></ion-icon>

    </div>

    <div class="item" style="--i: 4;">

      <ion-icon style="position: absolute; scale: 1.3; z-index: 10;" name="scan"></ion-icon>
      <ion-icon style="scale: .7; z-index: 5;"name="qr-code"></ion-icon>

    </div>

    <div class="item" style="--i: 5;" >
        
      <ion-icon name="folder"></ion-icon>

    </div>

  </div>

<script type="module" src="script.js"></script>

</body>

</html>
