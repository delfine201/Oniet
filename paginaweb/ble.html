<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE</title>

    <link rel="stylesheet" href="CSS/ble.css">
</head>

<body>

    <header class="bartop">
        <h1>Bluetooth</h1>
        <button class="theme" id="theme">
            <ion-icon id="itheme" name="moon"></ion-icon>
        </button>
    </header>

    <button id="connect">Conectar</button>

    <br><br>

    <input id="message" type="text" placeholder="Mensaje">

    <button id="send">Enviar</button>

    <p id="status">Desconectado</p>

    <pre id="received"></pre>

    <script>

        let device;
        let characteristic;

        const SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
        const CHARACTERISTIC_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb";


        document.getElementById("connect").addEventListener("click", async () => {

            try {

                device = await navigator.bluetooth.requestDevice({
                    filters: [
                        { services: [SERVICE_UUID] }
                    ]
                });

                document.getElementById("status").textContent =
                    "Conectando...";

                const server = await device.gatt.connect();

                const service =
                    await server.getPrimaryService(SERVICE_UUID);

                characteristic =
                    await service.getCharacteristic(CHARACTERISTIC_UUID);

                await characteristic.startNotifications();

                let buffer = "";

                characteristic.addEventListener(
                    "characteristicvaluechanged",
                    event => {

                        const decoder = new TextDecoder();

                        const mensaje = decoder.decode(event.target.value);

                        buffer += mensaje;

                        const partes = buffer.split("\n");

                        buffer = partes.pop();

                        for (const registro of partes) {

                            console.log("REGISTRO:", registro);

                            document.getElementById("received").textContent =
                                registro;
                        }
                    }
                );

                document.getElementById("status").textContent =
                    "🟢 Conectado a " + device.name;

            } catch (error) {

                console.error(error);

                document.getElementById("status").textContent =
                    "❌ Error: " + error.message;
            }

        });


        document.getElementById("send").addEventListener("click", async () => {

            if (!characteristic) {
                alert("Primero conectá el Bluetooth");
                return;
            }

            document.getElementById("received").textContent = "";

            const message =
                document.getElementById("message").value;

            const encoder = new TextEncoder();

            const data = encoder.encode(message);

            await characteristic.writeValue(data);

            console.log("Enviado:", message);

        });

    </script>

</body>
</html>
