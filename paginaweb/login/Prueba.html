<!DOCTYPE html>
<html class="dark">
<head>
  <meta charset="UTF-8">

  <title> LOGIN </title>
<!-- IONICONS -->
<script type="module"
src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js">

<body>
  <div class="bartop">
    <p id="mode"></p>
    <button class="theme" id="theme">
      <ion-icon id="itheme" name="moon"></ion-icon>
    </button>
  </div>

  <main class="acount">
    <div class="create_acount active">
      <div class="dates active">

          <button class="B_I_" > A </button>

        <textarea ></textarea>

        <textarea ></textarea>
        <p class="date">Fecha de nacimiento:</p>
        <input type="date" max="115">
        <p class="date">Gmail:</p>
        <input type="email" placeholder="tugmail@gmail.com">
        <footer class="buttons">
          <button class="bcancel">Cancelar</button>
          <button class="bnext">Siguiente</button>
        </footer>
      </div>
      <div class="password">
        <p class="date">Cree una contraseña: </p>
        <input class="password1" type="password">
        <p class="date">Confirme la contraseña:</p>
        <input class="password1" type="password">
        <div class="check">
          <div class="checkbox">
            <ion-icon style="opacity: 0" class="imostrar" name="checkmark-done"></ion-icon>
          </div> 
          Mostrar Contraseña
        </div>
        <footer class="buttons">
          <button class="bcancel back">Volver</button>
          <button class="bcreate">Crear Cuenta</button>
        </footer>
      </div>
    </div>
    <div class="login">
      <div class="dates active">
        <!--<div class="B_C_" >

        <p class="date">Apellidos:</p>
        <textarea ></textarea>
        <p class="date">Fecha de nacimiento:</p>
        <input type="date" max="115">-->
        <p class="date">Gmail:</p>
        <input type="email" placeholder="tugmail@gmail.com">

          <button class="bcancel">Cancelar</button>

          <div class="checkbox">
            <ion-icon style="opacity: 0" class="imostrar" name="checkmark-done"></ion-icon>
          </div> 
          Mostrar Contraseña
        </div>
        <footer class="buttons">
          <button class="bcancel">Cancelar</button>
          <button class="bcreate">Iniciar Sesión</button>
        </footer>
      </div>
      <div class="password active"></div>
    </div>
    <div id="circulo" class="circulo">
      <div class="panel">
        <h2 id="txtm">¿Ya tienes cuenta?</h2>
        <button id="bcm" class="bcm">Inicia Sesión</button>

  <div class="zone">


    <!-- BOTÓN CENTRAL -->

    <div class="navigation">
      <ion-icon id="menu" name="menu"></ion-icon>
    </div>
